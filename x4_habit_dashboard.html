<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=800,height=480,initial-scale=1">
<title>X4 Habit Dashboard</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 800px;
    height: 480px;
    background: #fff;
    color: #000;
    font-family: Arial, Helvetica, sans-serif;
  }
  body { padding: 24px 30px; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 3px solid #000;
    padding-bottom: 12px;
    margin-bottom: 18px;
  }
  .title { font-size: 30px; font-weight: 800; letter-spacing: 1px; }
  .date { font-size: 22px; font-weight: 700; }
  .habit {
    display: grid;
    grid-template-columns: 38px 1fr 72px;
    align-items: center;
    min-height: 52px;
    border-bottom: 1px solid #888;
    font-size: 23px;
  }
  .status { font-size: 27px; font-weight: 900; }
  .done { font-weight: 700; }
  .streak { text-align: right; font-size: 19px; font-weight: 700; }
  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
  }
  .summary { font-size: 24px; font-weight: 800; }
  .percent { font-size: 34px; font-weight: 900; }
  .best { font-size: 19px; font-weight: 700; }
</style>
</head>
<body>
  <header>
    <div class="title">MY HABITS</div>
    <div class="date">25 SEP 2026</div>
  </header>

  <div class="habit"><div class="status">✓</div><div class="done">Fajr</div><div class="streak">🔥 18</div></div>
  <div class="habit"><div class="status">✓</div><div class="done">ILM / IQRA</div><div class="streak">🔥 12</div></div>
  <div class="habit"><div class="status">○</div><div>General Reading</div><div class="streak">🔥 7</div></div>
  <div class="habit"><div class="status">✓</div><div class="done">Write / Plan</div><div class="streak">🔥 21</div></div>
  <div class="habit"><div class="status">○</div><div>Gym</div><div class="streak">🔥 5</div></div>
  <div class="habit"><div class="status">✓</div><div class="done">Organize / Build</div><div class="streak">🔥 3</div></div>

  <footer>
    <div>
      <div class="summary">4 / 6 COMPLETE</div>
      <div class="best">Current overall streak: 12 days</div>
    </div>
    <div class="percent">67%</div>
  </footer>
</body>
</html>
